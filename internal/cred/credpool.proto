syntax = "proto3";

package miroxy.cred.v1;

option go_package = "miroxy/internal/cred/pb";

// CredpoolService is the Credpool sidecar API.
//
// Credpool manages credential leases across one or more miroxy instances.
// Its primary value over a local CredPool (core/selector/credpool.go) is
// shared rate-limit state: a 429 received by one miroxy instance immediately
// cools that credential for all instances, without duplicating the retry budget.
//
// Connect: client code is generated from this proto via `buf generate`.
// The generated client speaks gRPC, gRPC-Web, and Connect-JSON from a single
// file — no separate transport wiring required in miroxy.
service CredpoolService {
  // Acquire reserves a healthy credential for the given model + provider pair.
  // Returns a lease ID that must be returned to Release when the call finishes.
  // If no healthy credential is available, returns an error (caller falls back
  // to local credential chain rather than surfacing the error to the client).
  rpc Acquire(AcquireRequest) returns (AcquireResponse);

  // Release returns a leased credential to Credpool and reports the call outcome.
  // Credpool uses the outcome to update rate-limit and circuit-break counters
  // across all connected miroxy instances.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message AcquireRequest {
  // model is the upstream provider model name, e.g. "gemini-2.5-flash".
  string model = 1;
  // provider is the upstream provider, e.g. "gemini", "anthropic", "openai".
  string provider = 2;
}

message AcquireResponse {
  // credential is the API key or OAuth token value.
  // NEVER log this field. Treat as a secret for its entire lifetime.
  string credential = 1;
  // lease_id is an opaque identifier that must be passed back to Release.
  string lease_id = 2;
  // ttl_seconds is a hint: this lease expires automatically after this many
  // seconds if Release is not called (e.g. on miroxy crash). Callers should
  // call Release promptly regardless of this value.
  int64 ttl_seconds = 3;
}

message ReleaseRequest {
  // lease_id from AcquireResponse.
  string lease_id = 1;
  // rate_limited is true when the upstream returned HTTP 429 or equivalent.
  // Credpool uses this to apply an escalating cooldown on the credential.
  bool rate_limited = 2;
  // error is true when the upstream returned a non-429 error.
  // Credpool uses this to increment the circuit-break counter.
  bool error = 3;
}

message ReleaseResponse {}
